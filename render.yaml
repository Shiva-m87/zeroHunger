# Render Blueprint - deploys the whole project in one go.
# On render.com: New + -> Blueprint -> pick this GitHub repo -> paste MONGO_URI -> Apply.
services:
  # ---------- Backend (Express + Socket.IO) ----------
  - type: web
    name: zerohunger-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false # Render asks you for this value (your Atlas connection string)
      - key: JWT_SECRET
        generateValue: true # Render creates a random secret
      - key: CLIENT_URL # the frontend's address, filled in automatically
        fromService:
          type: web
          name: zerohunger-web
          property: host

  # ---------- Frontend (React static site) ----------
  - type: web
    name: zerohunger-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # React Router: send every URL to index.html so page refresh works
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL # the backend's address, filled in automatically
        fromService:
          type: web
          name: zerohunger-api
          property: host
